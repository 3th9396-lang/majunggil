<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>마중길 아이 앱 연결</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 이 페이지에만 쓰는 버튼·숫자 (공용 style.css는 건드리지 않는다) */
  .button{display:block;text-align:center;padding:16px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;text-decoration:none}
  .code{font-size:32px;font-weight:800;letter-spacing:4px;text-align:center;margin:8px 0 0}
</style>
</head>
<body>
<!--
  아이 폰 연결 링크 (Q2, 2026-11-21 사용자 결정 A). 보호자 앱이 보내는 주소: link.html#c=123456
  - 숫자는 # 뒤에 둔다: 브라우저가 서버로 보내지 않아 GitHub 접속 기록에 남지 않는다. 이 페이지는 바깥 스크립트·통계를 쓰지 않는다
  - 안드로이드: 아이 앱을 연다(majunggilkid://link?c=…). 앱이 없으면 Play 스토어로 가며 설치 정보(referrer)에 c=…를 담는다
    → 설치 뒤 아이 앱 연결하기 화면이 그 숫자를 채운다. 연결은 아이가 [연결하기]를 직접 눌러야 된다
  - 아이폰 (2026-11-25 아이폰 점검표): 저절로 넘기지 않고 [앱 열기] 버튼만 (앱이 없으면 사파리가 '주소가 유효하지 않음' 창을 띄워서, 반뼘 초대 페이지와 같게).
    App Store 버튼은 APP_STORE_ID가 생기면 보이고, 그 전엔 '아이폰 앱은 곧 나와요' 한 줄
  - 그 밖(PC)·앱이 안 열릴 때: 숫자를 보여 주고 손으로 넣게 한다
  - 원본은 05-family-app 저장소 web/policies/link.html. 고치면 공개 저장소(3th9396-lang/majunggil)에 복사해 올린다
-->
<main>
<header>
  <span class="brand">마중길</span>
  <h1>마중길 아이 앱 연결</h1>
  <p class="meta">보호자가 보낸 연결 링크예요</p>
</header>

<div id="ok" hidden>
  <div id="android" hidden>
    <p><a id="open" class="button" href="#">마중길 아이 앱 열기</a></p>
    <p>앱이 없으면 설치 화면으로 가요. 설치한 뒤 앱을 열면 숫자가 들어가 있어요. 숫자가 없으면 이 링크를 한 번 더 눌러 주세요.</p>
  </div>
  <div id="ios" hidden>
    <p><a id="iosOpen" class="button" href="#">마중길 아이 앱 열기</a></p>
    <p><a id="appStore" class="button" href="#" hidden>App Store에서 받기</a></p>
    <p class="meta" id="iosSoon" hidden>아이폰 앱은 곧 나와요.</p>
    <p>앱이 열리지 않으면 아이 앱을 설치하고 열어서 아래 숫자를 넣어 주세요.</p>
  </div>
  <div class="box">
    <p>링크가 안 열리면 아이 앱에 이 숫자를 넣어요</p>
    <p class="code" id="code"></p>
  </div>
</div>

<div id="bad" hidden class="box">
  <p>링크가 잘못됐거나 숫자가 빠졌어요. 보호자에게 링크를 다시 보내 달라고 해 주세요.</p>
</div>
</main>
<script>
(function () {
  var PKG = 'kr.pantarei.majunggil.child';
  var raw = (location.hash || '').replace(/^#/, '') + '&' + (location.search || '').replace(/^\?/, '');
  var code = null;
  raw.split('&').forEach(function (p) {
    var i = p.indexOf('=');
    if (i > 0 && p.slice(0, i) === 'c') {
      try { code = decodeURIComponent(p.slice(i + 1)); } catch (e) { code = null; }
    }
  });
  if (!code || !/^[0-9]{6}$/.test(code)) {
    document.getElementById('bad').hidden = false;
    return;
  }
  document.getElementById('ok').hidden = false;
  document.getElementById('code').textContent = code.slice(0, 3) + ' ' + code.slice(3);
  var ua = navigator.userAgent;
  var android = /android/i.test(ua);
  // 아이폰·아이패드 (아이패드 사파리는 맥처럼 보이지만 터치가 있다)
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  // App Store 앱 번호. 출시 전이라 null (null이면 App Store 버튼을 숨기고 '곧 나와요')
  var APP_STORE_ID = null;
  var scheme = 'majunggilkid://link?c=' + code;
  if (android) {
    var store = 'https://play.google.com/store/apps/details?id=' + PKG + '&referrer=' + encodeURIComponent('c=' + code);
    var href = 'intent://link?c=' + code + '#Intent;scheme=majunggilkid;package=' + PKG + ';S.browser_fallback_url=' + encodeURIComponent(store) + ';end';
    document.getElementById('android').hidden = false;
    document.getElementById('open').href = href;
    // 안드로이드는 열리자마자 한 번 앱으로 (막히는 브라우저는 버튼으로)
    setTimeout(function () { location.href = href; }, 300);
  } else if (ios) {
    document.getElementById('ios').hidden = false;
    document.getElementById('iosOpen').href = scheme; // 누를 때만 연다 (저절로 넘기지 않음)
    if (APP_STORE_ID) {
      var a = document.getElementById('appStore');
      a.href = 'https://apps.apple.com/kr/app/id' + APP_STORE_ID;
      a.hidden = false;
    } else {
      document.getElementById('iosSoon').hidden = false;
    }
  }
})();
</script>
</body>
</html>
